name: Build MyExpenses APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Add Android platform and File plugin
        run: |
          cordova platform add android@13.0.0
          cordova plugin add cordova-plugin-file@8.1.0

      - name: Build debug APK
        run: cordova build android --debug

      - name: Find APK
        run: find platforms/android/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyExpenses-v5-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
